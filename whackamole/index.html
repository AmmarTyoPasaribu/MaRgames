<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Whack-a-Mole — MaRgames</title>
  <meta name="description" content="Whack the moles, dodge the bombs — how high can you score in 30 seconds?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#07070d">
  <link rel="apple-touch-icon" href="../logo.png">
</head>
<body>
  <div class="bg-particles" id="bg-particles"></div>

  <div id="screen-home" class="screen screen--active">
    <div class="home">
      <div class="home__hero">
        <div class="home__logo">🔨</div>
        <h1 class="home__title">Whack-a-<span class="accent">Mole</span></h1>
        <p class="home__subtitle">Quick reflexes, quicker taps!</p>
        <p class="home__author">by <span class="accent">MaRnevorget</span></p>
      </div>
      <button class="play-card" id="btn-home-play" type="button">
        <span class="play-card__emoji">▶</span>
        <div class="play-card__info"><h3>Play Whack-a-Mole</h3><p>Score as high as you can in 30s</p></div>
      </button>
      <div class="home__howto">
        <h2 class="section-label">How to Play</h2>
        <div class="howto-grid">
          <div class="howto-item"><span>🐹</span><p>Tap moles to score</p></div>
          <div class="howto-item"><span>💣</span><p>Avoid the bombs!</p></div>
          <div class="howto-item"><span>⏱️</span><p>30 seconds timer</p></div>
          <div class="howto-item"><span>🏆</span><p>Beat your record!</p></div>
        </div>
      </div>
      <a href="../" class="home__back">🏠 Back to Dashboard</a>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div class="app" id="app">
      <div class="topbar">
        <button class="btn-icon" id="btn-back" title="Back" aria-label="Back to menu">←</button>
        <h1 class="topbar__title">🔨 <span class="accent">Whack-a-Mole</span></h1>
        <div class="topbar__right">
          <button class="btn-icon" id="btn-sound" title="Sound" aria-label="Toggle sound">🔊</button>
          <button class="btn-icon" id="btn-new" title="Restart" aria-label="Restart game">🔄</button>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-val" id="score">0</span></div>
        <div class="stat"><span class="stat-label">Time</span><span class="stat-val" id="timer" aria-live="polite">30</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-val" id="best">0</span></div>
      </div>
      <div class="board" id="board"></div>
      <p class="brand">by <strong class="accent">MaRnevorget</strong></p>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay__content">
      <div class="overlay__emoji" id="ov-emoji">🔨</div>
      <h2 id="ov-title">Ready?</h2>
      <p id="ov-msg">Whack as many moles as you can in 30s!</p>
      <button class="btn-play" id="btn-start">▶ Start</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
