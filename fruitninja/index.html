<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Fruit Ninja — MaRgames</title>
  <meta name="description" content="Swipe to slash fruits!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#07070d">
  <link rel="apple-touch-icon" href="../logo.png">
</head>
<body>
  <div id="screen-home" class="screen screen--active">
    <div class="home">
      <div class="home__hero">
        <div class="home__logo">🍉</div>
        <h1 class="home__title"><span class="accent">Fruit</span> Ninja</h1>
        <p class="home__subtitle">Slash all the fruits!</p>
        <p class="home__author">by <span class="accent">MaRnevorget</span></p>
      </div>
      <button class="play-card" id="btn-home-play">
        <span class="play-card__emoji">▶</span>
        <div class="play-card__info"><h3>Play Fruit Ninja</h3><p>Swipe to slice fruits — avoid bombs!</p></div>
      </button>
      <div class="home__howto">
        <h2 class="section-label">How to Play</h2>
        <div class="howto-grid">
          <div class="howto-item"><span>👆</span><p>Swipe/drag to slice</p></div>
          <div class="howto-item"><span>🍎</span><p>Slice fruits for points</p></div>
          <div class="howto-item"><span>💣</span><p>Avoid bombs!</p></div>
          <div class="howto-item"><span>🏆</span><p>Beat the high score!</p></div>
        </div>
      </div>
      <a href="../" class="home__back">🏠 Back to Dashboard</a>
    </div>
  </div>
  <div id="screen-game" class="screen">
    <div class="app">
      <div class="topbar">
        <button class="btn-icon" id="btn-back" title="Back">←</button>
        <h1 class="topbar__title">🍉 <span class="accent">Fruit Ninja</span></h1>
        <div class="topbar__right">
          <button class="btn-icon" id="btn-sound" title="Sound">🔊</button>
          <button class="btn-icon" id="btn-pause" title="Pause">⏸</button>
          <button class="btn-icon" id="btn-new" title="Restart">🔄</button>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-val" id="score">0</span></div>
        <div class="stat"><span class="stat-label">Lives</span><span class="stat-val" id="lives">3</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-val" id="best">0</span></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay__content">
            <div class="overlay__emoji" id="ov-emoji">🍉</div>
            <h2 id="ov-title">Ready?</h2>
            <p id="ov-msg">Swipe to slice fruits!</p>
            <button class="btn-play" id="btn-start">▶ Play</button>
          </div>
        </div>
      </div>
      <p class="brand">by <strong class="accent">MaRnevorget</strong></p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
