<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Sudoku — MaRgames</title>
  <meta name="description" content="Play Sudoku with 3 difficulty levels!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../logo.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#07070d">
  <link rel="apple-touch-icon" href="../logo.png">
</head>
<body>
  <div class="bg-particles" id="bg-particles"></div>

  <div id="screen-home" class="screen screen--active">
    <div class="home">
      <div class="home__hero">
        <div class="home__logo">🔠</div>
        <h1 class="home__title"><span class="accent">Sudoku</span></h1>
        <p class="home__subtitle">Logic number puzzle</p>
        <p class="home__author">by <span class="accent">MaRnevorget</span></p>
      </div>
      <div class="home__cards">
        <button class="mode-card" data-diff="easy">
          <span class="mode-card__emoji">😊</span>
          <div class="mode-card__info"><h3>Easy</h3><p>38 clues given</p></div>
          <span class="mode-card__go">▶</span>
        </button>
        <button class="mode-card" data-diff="medium">
          <span class="mode-card__emoji">🤔</span>
          <div class="mode-card__info"><h3>Medium</h3><p>30 clues given</p></div>
          <span class="mode-card__go">▶</span>
        </button>
        <button class="mode-card" data-diff="hard">
          <span class="mode-card__emoji">🤯</span>
          <div class="mode-card__info"><h3>Hard</h3><p>24 clues given</p></div>
          <span class="mode-card__go">▶</span>
        </button>
      </div>
      <div class="home__howto">
        <h2 class="section-label">How to Play</h2>
        <div class="howto-grid">
          <div class="howto-item"><span>🔢</span><p>Fill 1–9 in each row</p></div>
          <div class="howto-item"><span>📋</span><p>Each column unique</p></div>
          <div class="howto-item"><span>📦</span><p>Each 3×3 box unique</p></div>
          <div class="howto-item"><span>🏆</span><p>Complete the puzzle!</p></div>
        </div>
      </div>
      <a href="../" class="home__back">🏠 Back to Dashboard</a>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div class="app">
      <div class="topbar">
        <button class="btn-icon" id="btn-back" title="Back">←</button>
        <h1 class="topbar__title">🔠 <span class="accent">Sudoku</span></h1>
        <div class="topbar__right">
          <button class="btn-icon" id="btn-sound" title="Sound">🔊</button>
          <button class="btn-icon" id="btn-new" title="New Puzzle">🔄</button>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat"><span class="stat-label">Time</span><span class="stat-val" id="timer">00:00</span></div>
        <div class="stat"><span class="stat-label">Errors</span><span class="stat-val" id="errors">0</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-val" id="best">--:--</span></div>
      </div>
      <div class="board" id="board"></div>
      <div class="numpad" id="numpad"></div>
      <p class="brand">by <strong class="accent">MaRnevorget</strong></p>
    </div>
    <div class="win-modal" id="win-modal">
      <div class="win-modal__content">
        <div class="win-modal__emoji">🎉</div>
        <h2>Puzzle Complete!</h2>
        <p id="win-time"></p>
        <button class="win-modal__close" id="btn-win-close">Nice!</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
